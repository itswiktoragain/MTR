name: Windows independent antivirus installer
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: mtr-windows-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build and smoke-test Qt application and installer
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MTR-Independent-Windows-Installer
          path: dist/*
          if-no-files-found: error
      - name: Publish Qt preview installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.3.${{ github.run_number }} dist/MTR-Setup.exe dist/MTR-Setup.sha256 dist/mtr-ui-preview.png dist/clamav-source.tar.gz dist/clamav-provenance.txt --target "${{ github.sha }}" --title "MTR independent antivirus preview build ${{ github.run_number }}" --notes "Unsigned experimental independent ClamAV user-mode antivirus. Includes upstream corresponding source archive. First launch downloads signatures. Not a kernel-mode protection product." --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
